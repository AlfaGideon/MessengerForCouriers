name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/52ee8420-messengerforcouriers
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'index.html'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 36 build tools
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm ci
      - name: Set OTA bundle version
        run: |
          current="$(python3 -c 'import json, pathlib; p=pathlib.Path("release/ota.json"); print(json.loads(p.read_text())["webVersion"] if p.exists() else 1)')"
          echo "EKIP_WEB_VERSION=$((current + 1))" >> "$GITHUB_ENV"
          echo "EKIP_APK_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "EKIP_APK_VERSION_NAME=1.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: npm run android:apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ekip-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK and OTA bundle to the Arena branch
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/ekip-debug.apk
          sha256sum release/ekip-debug.apk > release/ekip-debug.apk.sha256
          rm -f release/web-update.zip
          (cd dist && zip -X -q -r ../release/web-update.zip .)
          web_sha="$(sha256sum release/web-update.zip | cut -d' ' -f1)"
          cat > release/ota.json <<EOF
          {
            "webVersion": ${EKIP_WEB_VERSION},
            "webUpdateUrl": "https://raw.githubusercontent.com/AlfaGideon/MessengerForCouriers/arena/52ee8420-messengerforcouriers/release/web-update.zip",
            "webUpdateSha256": "${web_sha}"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/ekip-debug.apk release/ekip-debug.apk.sha256 release/web-update.zip release/ota.json
          git commit -m "Publish Ekip APK and OTA bundle"
          git push origin HEAD:${GITHUB_REF_NAME}
