name: Build native Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/52ee8420-messengerforcouriers
    paths:
      - 'android/**'
      - 'scripts/build-android-apk.sh'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-native-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 36 build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set APK version
        run: |
          echo "EKIP_APK_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "EKIP_APK_VERSION_NAME=2.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Build native APK
        run: |
          bash scripts/build-android-apk.sh
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          if unzip -l "$apk" | grep -q 'assets/public/'; then
            echo "Unexpected bundled web assets in native APK" >&2
            exit 1
          fi
          if unzip -p "$apk" classes.dex | strings | grep -q 'android/webkit/WebView'; then
            echo "Unexpected WebView reference in native APK" >&2
            exit 1
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ekip-native-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK on the Arena branch
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/ekip-debug.apk
          sha256sum release/ekip-debug.apk > release/ekip-debug.apk.sha256
          rm -f release/web-update.zip release/ota.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/ekip-debug.apk release/ekip-debug.apk.sha256
          git add -u release/
          git commit -m "Publish native Ekip APK"
          git push origin HEAD:${GITHUB_REF_NAME}
