plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.ekip.couriers'
    compileSdk 36

    defaultConfig {
        applicationId 'ru.ekip.couriers'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '2.0.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
